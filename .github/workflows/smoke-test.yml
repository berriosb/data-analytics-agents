name: smoke-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  installer:
    name: Installer smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run installer --help
        run: node ./bin/install.js --help

      - name: Run installer --dry-run (project)
        run: node ./bin/install.js install --all --dry-run

      - name: Run installer --dry-run (global Agy)
        run: node ./bin/install.js install --agy --global --dry-run

      - name: Run preflight (full install --all, expect success)
        run: node ./bin/install.js install --all

      - name: Verify symlinks created
        run: |
          test -L .opencode/agents/data-explorer.md
          test -L .opencode/skills/csv-profiler
          test -L .opencode/skills/api-builder
          test -L .claude/agents/data-explorer.md
          test -L .claude/skills/excel-profiler
          test -L .agents/skills/csv-profiler
          test -L .agents/skills/audit-log

      - name: Uninstall --all
        run: node ./bin/install.js uninstall --all

  python-smoke:
    name: Full Python smoke test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unified smoke tests
        run: make test